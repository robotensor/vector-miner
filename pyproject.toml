[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-miner"
version = "0.2.0"
description = "Miner tools for the Vector subnet's expert competition: evaluate your image locally, commit it once, serve it to phase 1, follow it, verify it"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx==0.28.1",
    "bittensor-wallet==4.1.0",
    "websockets==16.1.1",
]

[project.optional-dependencies]
chain = ["bittensor==11.3.5"]
test = ["pytest==9.2.0"]

[project.scripts]
vector-miner = "vector_miner.cli:main"

[tool.setuptools.packages.find]
include = ["vector_miner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
